name: weekly digest

on:
  schedule:
    # Beijing Monday/Thursday 06:43 = UTC Sunday/Wednesday 22:43 (note the day shift).
    # Deliberately off the hour and outside 00:00-01:00 UTC: GitHub's scheduled queue
    # is heavily oversubscribed there and runs get delayed by hours or dropped.
    # The ~1h buffer before 08:00 Beijing absorbs the remaining queue delay.
    - cron: "43 22 * * 0"
    - cron: "43 22 * * 3"
  workflow_dispatch:
    inputs:
      topic:
        description: Topic to run
        type: choice
        default: auto
        options:
          - auto
          - monday
          - thursday

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e .

      - name: Choose topic
        id: topic
        run: |
          INPUT="${{ github.event.inputs.topic }}"
          CRON="${{ github.event.schedule }}"
          if [ "$INPUT" = "monday" ] || [ "$INPUT" = "thursday" ]; then
            TOPIC="$INPUT"
          elif [ -n "$CRON" ]; then
            # Derive from the cron that fired, so shifting the trigger across the
            # UTC date boundary cannot flip the topic.
            case "$CRON" in
              "43 22 * * 0") TOPIC=monday ;;
              "43 22 * * 3") TOPIC=thursday ;;
              *) echo "Unhandled schedule: $CRON" >&2; exit 1 ;;
            esac
          else
            DOW=$(date -u +%u)
            if [ "$DOW" = "4" ]; then TOPIC=thursday; else TOPIC=monday; fi
          fi
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "Running topic $TOPIC"

      - name: Check secrets
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          missing=0
          [ -z "$DEEPSEEK_API_KEY" ] && echo "Missing secret DEEPSEEK_API_KEY" && missing=1
          [ -z "$SMTP_USERNAME" ] && echo "Missing secret SMTP_USERNAME" && missing=1
          [ -z "$SMTP_PASSWORD" ] && echo "Missing secret SMTP_PASSWORD" && missing=1
          exit $missing

      - name: Run digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m pulmoradar run --topic ${{ steps.topic.outputs.topic }} --send

      - name: Record history and archive
        run: |
          git config user.name "pulmoradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json archive
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "chore: record ${{ steps.topic.outputs.topic }} digest"
            git push
          fi

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TOPIC: ${{ steps.topic.outputs.topic }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os

          from pulmoradar.config import load_config
          from pulmoradar.emailer import send_email

          cfg = load_config(None)
          # Alert only the primary recipient, not the digest CC list.
          cfg.setdefault("email", {})["cc"] = []
          topic = os.environ.get("TOPIC") or "unknown"
          run_url = os.environ["RUN_URL"]
          send_email(
              cfg,
              f"PulmoRadar Actions 运行失败 · {topic}",
              f'<p>本次 {topic} 周报的 workflow 失败了，请查看 '
              f'<a href="{run_url}">运行日志</a>。</p>',
          )
          PY
