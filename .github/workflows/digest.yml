name: weekly digest

on:
  schedule:
    # Beijing Monday/Thursday 08:00 = UTC 00:00
    - cron: "0 0 * * 1"
    - cron: "0 0 * * 4"
  workflow_dispatch:
    inputs:
      topic:
        description: Topic to run
        type: choice
        default: auto
        options:
          - auto
          - monday
          - thursday

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e .

      - name: Choose topic
        id: topic
        run: |
          INPUT="${{ github.event.inputs.topic }}"
          if [ "$INPUT" = "monday" ] || [ "$INPUT" = "thursday" ]; then
            TOPIC="$INPUT"
          else
            DOW=$(date -u +%u)
            if [ "$DOW" = "4" ]; then TOPIC=thursday; else TOPIC=monday; fi
          fi
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "Running topic $TOPIC"

      - name: Check secrets
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          missing=0
          [ -z "$DEEPSEEK_API_KEY" ] && echo "Missing secret DEEPSEEK_API_KEY" && missing=1
          [ -z "$SMTP_USERNAME" ] && echo "Missing secret SMTP_USERNAME" && missing=1
          [ -z "$SMTP_PASSWORD" ] && echo "Missing secret SMTP_PASSWORD" && missing=1
          exit $missing

      - name: Run digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m pulmoradar run --topic ${{ steps.topic.outputs.topic }} --send

      - name: Record history and archive
        run: |
          git config user.name "pulmoradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json archive
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "chore: record ${{ steps.topic.outputs.topic }} digest"
            git push
          fi
