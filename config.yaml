llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  language: Chinese

pubmed:
  days_back: 90
  retmax: 200
  window_retmax: 400
  contact_email: doctorfhz@gmail.com
  tool: pulmoradar
  api_key_env: NCBI_API_KEY
  date_field: edat

windows:
  days: [10, 30, 60, 90]
  recent_days: 30
  flagship_days: 1095
  classic_days: 7300
  min_published_pool: 6
  min_preprint_pool: 6

selection:
  published_n: 3
  preprint_n: 3
  hard_quota: false
  screen_batch: 8
  rank_shortlist: 10
  fulltext_n: 12
  max_screen: 40
  quality_gate:
    min_impact_factor: 5
    impact_factor_exclusive: true
    max_cas_zone: 2
    max_xinyue_zone: 2
    unknown_journal: reject
    exclude_publishers:
      - Frontiers
      - MDPI
      - Hindawi
      - Bentham
      - Scientific Research Publishing
      - SCIRP
      - OMICS

exclude_publication_types:
  - Review
  - Systematic Review
  - Editorial
  - Comment
  - Letter
  - Case Reports
  - Meta-Analysis
  - Guideline
  - Practice Guideline
  - News
  - Published Erratum
  - Retracted Publication
  - Retraction of Publication

digest_groups:
  monday:
    name: 慢性肺病机制
    weekday: monday
    tracks:
      - copd
      - fibrosis
    preprint_n: 3
  thursday:
    name: 肺动脉高压 / PAH · 流感肺损伤
    weekday: thursday
    tracks:
      - pah
      - influenza
    preprint_n: 3

topics:
  copd:
    name: COPD / 肺气肿机制
    weekday: monday
    published_n: 3
    pubmed_query: >-
      (
        ("COPD"[Title/Abstract] OR "chronic obstructive pulmonary disease"[Title/Abstract]
        OR emphysema[Title/Abstract] OR "alveolar destruction"[Title/Abstract]
        OR "airspace enlargement"[Title/Abstract])
      )
      OR
      (
        (lung[Title/Abstract] OR alveolar[Title/Abstract] OR pulmonary[Title/Abstract])
        AND
        (
          "alveolar type 2"[Title/Abstract] OR "alveolar type II"[Title/Abstract]
          OR "AT2 cell"[Title/Abstract] OR "AT2 cells"[Title/Abstract]
          OR "alveolar epithelial"[Title/Abstract] OR "alveolar progenitor"[Title/Abstract]
          OR PATS[Title/Abstract] OR DATP[Title/Abstract] OR KRT8[Title/Abstract]
          OR fibroblast[Title/Abstract] OR myofibroblast[Title/Abstract]
          OR "stromal cell"[Title/Abstract] OR mesenchymal[Title/Abstract]
          OR macrophage[Title/Abstract] OR neutrophil[Title/Abstract]
          OR "T cell"[Title/Abstract] OR "immune cell"[Title/Abstract]
        )
        AND
        (
          regeneration[Title/Abstract] OR repair[Title/Abstract]
          OR differentiation[Title/Abstract] OR "self-renewal"[Title/Abstract]
          OR progenitor[Title/Abstract] OR transitional[Title/Abstract]
          OR homeostasis[Title/Abstract]
        )
      )
    preprint_query: >-
      (
        (COPD OR "chronic obstructive pulmonary disease" OR emphysema
        OR "alveolar destruction" OR "airspace enlargement")
        OR
        (
          (lung OR alveolar OR pulmonary)
          AND
          ("alveolar type 2" OR "alveolar type II" OR "AT2 cell" OR "AT2 cells"
          OR "alveolar epithelial" OR "alveolar progenitor" OR PATS OR DATP OR KRT8
          OR fibroblast OR myofibroblast OR "stromal cell" OR mesenchymal
          OR macrophage OR neutrophil OR "T cell" OR "immune cell")
          AND
          (regeneration OR repair OR differentiation OR "self-renewal" OR progenitor
          OR transitional OR homeostasis)
        )
      )
    focus: >-
      Mechanistic COPD/emphysema and alveolar maintenance: destruction, homeostasis, regeneration.
      In scope: lung epithelium (AT2/AT1 fate, DATP, PATS, KRT8), lung stromal cells
      (fibroblast, myofibroblast, mesenchymal stroma), and lung immune cells, when they drive
      alveolar damage or repair. Out of scope: non-lung tissue, tumorigenesis as the endpoint,
      embryonic development, and clinical COPD.
    boost_keywords:
      - alveolar destruction
      - alveolar regeneration
      - alveolar homeostasis
      - alveolar epithelial
      - AT2
      - transitional
      - DATP
      - PATS
      - KRT8
      - self-renewal
      - Wnt
      - emphysema
      - stromal
      - mesenchymal
      - fibroblast
      - myofibroblast
      - macrophage
      - neutrophil
      - T cell
      - lineage tracing
      - elastase
      - cigarette smoke
  fibrosis:
    name: 肺纤维化（成纤维细胞 / 免疫）
    weekday: monday
    published_n: 3
    pubmed_query: >-
      ("pulmonary fibrosis"[Title/Abstract] OR IPF[Title/Abstract]
      OR "idiopathic pulmonary fibrosis"[Title/Abstract] OR "lung fibrosis"[Title/Abstract])
      AND (fibroblast[Title/Abstract] OR myofibroblast[Title/Abstract]
      OR macrophage[Title/Abstract] OR immune[Title/Abstract]
      OR inflammation[Title/Abstract] OR "single-cell"[Title/Abstract])
    preprint_query: >-
      (("pulmonary fibrosis" OR IPF OR "idiopathic pulmonary fibrosis" OR "lung fibrosis")
      AND (fibroblast OR myofibroblast OR macrophage OR immune))
    focus: >-
      Pulmonary fibrosis mechanistic work, especially fibroblasts, myofibroblasts,
      and immune-stromal crosstalk in lung.
    boost_keywords:
      - fibroblast
      - myofibroblast
      - macrophage
      - immune
      - TGF-beta
      - ECM
      - bleomycin
      - IPF
  pah:
    name: 肺动脉高压 / PAH
    weekday: thursday
    published_n: 3
    pubmed_query: >-
      ("pulmonary hypertension"[Title/Abstract] OR "pulmonary arterial hypertension"[Title/Abstract]
      OR "PAH"[Title/Abstract] OR "group 3 pulmonary hypertension"[Title/Abstract]
      OR "hypoxic pulmonary hypertension"[Title/Abstract]
      OR "pulmonary vascular remodeling"[Title/Abstract])
    preprint_query: >-
      ("pulmonary hypertension" OR "pulmonary arterial hypertension" OR PAH
      OR "group 3 pulmonary hypertension" OR "hypoxic pulmonary hypertension"
      OR "pulmonary vascular remodeling")
    focus: >-
      Pulmonary hypertension / PAH original research. Prefer flagship journals
      (Circulation, Circulation Research, EHJ, ERJ, AJRCCM) and strong titles
      (ATVB, Hypertension, Nature Communications and similar).
    preferred_journals:
      - Circulation
      - Circulation Research
      - European Heart Journal
      - European Respiratory Journal
      - American Journal of Respiratory and Critical Care Medicine
    extra_journals:
      - Arteriosclerosis, Thrombosis, and Vascular Biology
      - Hypertension
      - Nature Communications
      - Nature
      - Science
      - Cell
      - JCI
      - Cardiovascular Research
    boost_keywords:
      - pulmonary vascular remodeling
      - endothelium
      - PASMC
      - fibroblast
      - group 3
      - hypoxia

  influenza:
    name: 流感病毒肺损伤（上皮 / 基底细胞 / 免疫）
    weekday: thursday
    published_n: 3
    pubmed_query: >-
      (influenza[Title/Abstract] OR "influenza A virus"[Title/Abstract]
      OR H1N1[Title/Abstract] OR H5N1[Title/Abstract] OR H7N9[Title/Abstract])
      AND (lung[Title/Abstract] OR pulmonary[Title/Abstract] OR respiratory[Title/Abstract])
      AND (epithelial[Title/Abstract] OR "basal cell"[Title/Abstract]
      OR immune[Title/Abstract] OR macrophage[Title/Abstract]
      OR neutrophil[Title/Abstract] OR alveolar[Title/Abstract])
    preprint_query: >-
      (influenza OR "influenza A virus" OR H1N1 OR H5N1 OR H7N9)
      AND (lung OR pulmonary OR respiratory)
      AND (epithelial OR "basal cell" OR immune OR macrophage OR neutrophil OR alveolar)
    focus: >-
      Original basic research on influenza-virus injury in lung, especially epithelial cells,
      airway basal cells, alveolar epithelial cells, macrophages, neutrophils, T cells,
      innate immunity, tissue repair, and epithelial-immune crosstalk. Prefer mechanistic
      studies with relevant viral models and clear lung injury or repair readouts.
    boost_keywords:
      - influenza A virus
      - H1N1
      - H5N1
      - H7N9
      - lung epithelial cell
      - airway epithelial cell
      - basal cell
      - alveolar epithelial
      - macrophage
      - neutrophil
      - T cell
      - innate immunity
      - epithelial repair
      - tissue repair
      - single-cell

profile:
  boost_keywords:
    - fibroblast
    - myofibroblast
    - macrophage
    - neutrophil
    - immune
    - alveolar destruction
    - alveolar regeneration
    - alveolar homeostasis
    - endothelium
    - PASMC
