<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>PulmoRadar logos</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #f8f7f0; color: #173b3a; margin: 32px; }
    h1 { font-size: 20px; }
    .row { display: flex; gap: 28px; flex-wrap: wrap; margin: 20px 0 36px; }
    .card { background: #fff; border: 1px solid #e1e9e6; border-radius: 16px; padding: 20px; min-width: 220px; }
    .on-soft { background: #dce9e7; }
    .on-blue { background: #e4eff8; }
    img.hero { width: 200px; height: 200px; display: block; }
    img.icon { width: 54px; height: 54px; display: block; border-radius: 14px; }
    p { font-size: 13px; color: #667575; }
  </style>
</head>
<body>
  <h1>PulmoRadar topic marks</h1>
  <div class="row">
    <div class="card">
      <p>Chronic Lung · hero</p>
      <img class="hero" src="chronic-lung-512.png" alt="Chronic Lung"/>
    </div>
    <div class="card on-soft">
      <p>Chronic Lung · 54px on Monday header</p>
      <img class="icon" src="chronic-lung-icon-108.png" width="54" height="54" alt="Chronic Lung icon"/>
    </div>
    <div class="card">
      <p>PAH · hero</p>
      <img class="hero" src="pah-512.png" alt="PAH"/>
    </div>
    <div class="card on-blue">
      <p>PAH · 54px on Thursday header</p>
      <img class="icon" src="pah-icon-108.png" width="54" height="54" alt="PAH icon"/>
    </div>
  </div>
</body>
</html>
